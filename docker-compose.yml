services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spendcount
      POSTGRES_USER: spendcount
      POSTGRES_PASSWORD: spendcount-local
    ports:
      - "5432:5432"
    volumes:
      - spendcount_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendcount -d spendcount"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://spendcount:spendcount-local@db:5432/spendcount
      SECRET_KEY: local-compose-change-this-secret-before-deployment
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./dataset:/dataset
    depends_on:
      db:
        condition: service_healthy
  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      - api
volumes:
  spendcount_pg:
  frontend_modules:
